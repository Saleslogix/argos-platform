<!--
  ============================================================================
  Cordova WebView Entry Template
  ============================================================================
  Feature: cordova-native-shell-bundling
  Requirements: 4.1, 4.2, 4.3, 4.4, 4.5, 4.6, 6.4, 7.1, 8.4

  CONTRACT: This file mirrors the bootstrap shape of
  `products/argos-saleslogix/index.html` (the modern web entry document).

  Any change to the bootstrap shape in `products/argos-saleslogix/index.html`
  - the Soho config block, the `argos-dependencies.js` script, the Dojo
  `data-dojo-config` attribute, the AMD `require` configuration (packages /
  map / baseUrl), the supported locales list, the `window.localStorage` locale
  resolution, the locale and regional file lists, the
  `crm/polyfills/index` + `crm/Bootstrap` invocation arguments, or the
  `rootNode` element id - MUST be mirrored into this template. The web and
  native bootstraps are intended to diverge ONLY in the Cordova-specific
  deltas declared below:

    1. The `<script src="cordova.js">` tag added before the argos dependency
       scripts (Cordova injects `cordova.js` during `cordova prepare`).
    2. The `<meta http-equiv="Content-Security-Policy">` tag in `<head>`.
    3. The `deviceready` guard wrapped around the final
       `require(['crm/polyfills/index', 'crm/Bootstrap'], ...)` call. The guard
       mirrors the semantics of `cordova/lib/bootstrapGuard.js`: bootstrap runs
       exactly once per page load, deferred until `deviceready` fires or a
       10000 ms fallback timeout elapses (so this same `index.html` can be
       opened in a desktop browser for diagnostics).

  This template is NOT derived from the legacy PhoneGap entry document that
  used to live alongside the web app. That stale file referenced a legacy
  localization path that no longer exists, declared an inline `dojoConfig`
  shim, and misplaced `<body>`; it is a historical reference for the
  `deviceready` pattern only and is intentionally not named or copied here.
  ============================================================================
-->

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

    <!-- Content Security Policy: 'self' covers the local file origin under Cordova,
         gap: covers the iOS bridge scheme, 'unsafe-eval' is required by the Dojo AMD
         loader. The https://*.infor.com host stands in for the configured
         Server_Endpoint hosts and is replaced in customer-specific builds. -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' gap: 'unsafe-eval' https://*.infor.com;
      script-src  'self' 'unsafe-eval' https://*.infor.com;
      style-src   'self' 'unsafe-inline';
      img-src     'self' data: blob: https://*.infor.com;
      connect-src 'self' gap: https://*.infor.com;
    ">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />

    <meta name="format-detection" content="telephone=no,email=no,address=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- Provide an empty resource expected by l20n lib. Argos loads l20n files during bootstrap -->
    <script type="application/l20n">{}</script>

    <!-- Cordova: injected automatically during `cordova prepare`. Loaded before the
         argos dependency scripts so the `deviceready` guard below can rely on it. -->
    <script src="cordova.js"></script>

    <!-- Soho Configuration -->
    <script type="application/javascript">
      var SohoConfig = {
        culturesPath: 'content/javascript/cultures/',
        minifyCultures: true,
        personalize: {
          noInit: true
        }
      };
    </script>

    <!-- Global (window) dependencies. Load these before the AMD loader -->
    <script type="text/javascript" src="content/javascript/argos-dependencies.js"></script>

    <!-- Dojo -->
    <script type="text/javascript" src="content/dojo/dojo/dojo.js" data-dojo-config="parseOnLoad:false, async:true, blankGif:'content/images/blank.gif'"></script>
    <script type="text/javascript">
    require({
        baseUrl: "./",
        packages: [
            { name: 'dojo', location: 'content/dojo/dojo' },
            { name: 'dijit', location: 'content/dojo/dijit' },
            { name: 'configuration', location: 'configuration' },
            { name: 'localization', location: 'localization' }
        ],
        map: {
            '*': {
                'Sage/Platform/Mobile': 'argos',
                'Mobile/SalesLogix': 'crm',
                'icboe': 'crm/Integrations/BOE'
            }
        }
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc = "content/javascript/pdf.worker.min.js";
    </script>
    <script type="text/javascript" src="content/dojo/dojo-dependencies.js"></script>
    <script type="text/javascript" src="content/javascript/argos-amd-dependencies.js"></script>
    <script type="text/javascript" src="content/javascript/argos-sdk.js"></script>

    <!-- Application -->
    <script type="text/javascript" src="content/javascript/argos-saleslogix.js"></script>
  </head>

  <body>
    <noscript>
      <p>JavaScript is required for this application.</p>
    </noscript>

    <div id="rootNode"></div>
    <script type="text/javascript">
      var language, regionLocale;
      if (window.localStorage) {
        language = window.localStorage.getItem('language');
        regionLocale = window.localStorage.getItem('region');
      }

      var languages = {"de":"Deutsch (Deutschland)","en":"English (United States)","en-GB":"English (United Kingdom)","es":"Español (internacional)","fr":"français (France)","it":"italiano (Italia)","ja":"日本語 (日本)","nl":"Nederlands (Nederland)","pt-BR":"Português (Brasil)","ru":"Русский (Россия)","th":"ไทย (ประเทศไทย)","zh-CN":"简体中文","zh-TW":"繁體中文"};

      var supportedLocales = [
            'en',
            'en-GB',
            'de',
            'fr',
            'it',
            'ru',
            'zh-CN',
            'zh-TW',
            'es',
            'pt-BR',
            'ja',
            'nl',
            'th'
          ],
        defaultLocale = 'en',
        currentLocale = language || 'en',
        parentLocale = language || 'en',
        defaultRegionLocale = 'en',
        currentRegionLocale = regionLocale || 'en',
        parentRegionLocale = regionLocale || 'en';

    (function() {
      // Shim, sohoxi will use define.amd and require it.
      define('jquery', function () {
          return window.$;
      });

      // Cordova deviceready guard (mirrors cordova/lib/bootstrapGuard.js semantics).
      // crm/Bootstrap runs exactly once per page load, deferred until either the
      // Cordova `deviceready` event fires or a 10000 ms fallback timeout elapses so
      // the same index.html can be opened in a desktop browser for diagnostics.
      var bootstrapped = false;
      function startApp() {
        if (bootstrapped) {
          return;
        }
        bootstrapped = true;

        require(['crm/polyfills/index', 'crm/Bootstrap'], function(polyfills, bootstrap) {
          bootstrap({
            supportedLocales: supportedLocales,
            defaultLocale: defaultLocale,
            currentLocale: currentLocale,
            parentLocale: parentLocale,
            defaultRegionLocale: defaultRegionLocale,
            currentRegionLocale: currentRegionLocale,
            parentRegionLocale: parentRegionLocale,
            isRegionMetric: false,
            configuration: [
              'configuration/production'
            ],
            application: 'crm/Application',
            legacyLocalization: [
              'localization/saleslogix/en'
            ],
            legacyLocalizationFallback: [
              'localization/saleslogix/en'
            ],
            localeFiles: [
              './localization/locales/crm/en/strings.l20n',
              './localization/locales/icboe/en/strings.l20n',
              './localization/locales/contour/en/strings.l20n',
              './localization/locales/argos/en/strings.l20n',
            ],
            regionalFiles: [
              './localization/locales/crm/en/regional.l20n',
              './localization/locales/icboe/en/regional.l20n',
              './localization/locales/argos/en/regional.l20n',
            ],
            rootElement: document.getElementById('rootNode')
          });
        });
      }

      document.addEventListener('deviceready', startApp, false);
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!bootstrapped) {
            console.warn('cordova: deviceready did not fire within 10000 ms; bootstrapping anyway');
            startApp();
          }
        }, 10000);
      }, false);
    })();
  </script>
</body>
</html>
